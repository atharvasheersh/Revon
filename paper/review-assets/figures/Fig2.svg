<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="563.1067961165" viewBox="0 0 1600 563.1067961165">
  <title>Diff-path selection for a version pair</title>
  <desc>The requested version pair is validated and its operations counted. If an ancestor path exists and its operations are at most T, use log aggregation, reversing when needed. Otherwise use Merkle comparison. Both paths return the same sorted semantic diff.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#37474f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="563.1067961165" fill="white"/>
  <g fill="white" stroke-width="2.8">
    <rect x="25" y="221" width="240" height="135" rx="7" stroke="#355f9d"/>
    <rect x="335" y="201" width="300" height="175" rx="7" stroke="#355f9d"/>
    <rect x="705" y="201" width="310" height="175" rx="7" stroke="#00838b"/>
    <rect x="1210" y="65" width="365" height="145" rx="7" stroke="#00838b"/>
    <rect x="1210" y="365" width="365" height="145" rx="7" stroke="#ba5a34"/>
  </g>
  <g fill="none" stroke="#37474f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 272 288.5 H 328" marker-end="url(#arrow)"/>
    <path d="M 642 288.5 H 698" marker-end="url(#arrow)"/>
    <path d="M 1015 288.5 H 1115"/>
    <path d="M 1115 137.5 V 437.5"/>
    <path d="M 1115 137.5 H 1203" marker-end="url(#arrow)"/>
    <path d="M 1115 437.5 H 1203" marker-end="url(#arrow)"/>
  </g>
  <circle cx="1115" cy="288.5" r="4.5" fill="#37474f"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#000000">
    <text x="145" y="279"><tspan x="145">Requested</tspan><tspan x="145" dy="38">version pair</tspan></text>
    <text x="485" y="258"><tspan x="485">Validate versions</tspan><tspan x="485" dy="38">and ancestry;</tspan><tspan x="485" dy="38">count operations</tspan></text>
    <text x="860" y="258"><tspan x="860">Ancestor path</tspan><tspan x="860" dy="38">exists and</tspan><tspan x="860" dy="38">operations &#8804; T?</tspan></text>
    <text x="1392.5" y="128"><tspan x="1392.5">Log aggregation</tspan><tspan x="1392.5" dy="38">(reverse if needed)</tspan></text>
    <text x="1392.5" y="428"><tspan x="1392.5">Merkle comparison</tspan><tspan x="1392.5" dy="38">(prune equal hashes)</tspan></text>
    <text x="1158" y="115" font-size="28">Yes</text>
    <text x="1158" y="415" font-size="28">No</text>
    <text x="800" y="550" font-size="28">Both paths return the same sorted semantic diff</text>
  </g>
</svg>
